<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>윤&준우의 부산 여행</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--ink:#16181d;--sub:#6b7078;--line:#ececea;--accent:#1f5eff;--accent-soft:#eef3ff;--green:#03c75a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 80px}
header{padding:56px 0 28px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--sub);font-weight:600}
h1{font-size:30px;line-height:1.25;letter-spacing:-.03em;margin:10px 0 6px;font-weight:700}
.lead{color:var(--sub);font-size:15px;margin:0}
.facts{display:flex;gap:20px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.facts b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-top:2px}
.note{margin:0 0 20px;padding:14px 16px;background:var(--accent-soft);border-radius:14px;font-size:13.5px;color:#2a3f78}
.tabs{position:sticky;top:0;z-index:5;background:rgba(250,250,249,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 0;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#efefed;border-radius:12px;padding:3px}
.tab{border:0;background:none;padding:10px;border-radius:10px;font:inherit;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.panel{display:none}.panel.on{display:block}
.day-title{margin:24px 0 4px;font-size:20px;letter-spacing:-.02em;font-weight:700}
.route{font-size:13px;color:var(--sub);margin:0 0 20px}
.stop{display:grid;grid-template-columns:64px 1fr;gap:0 14px;padding:18px 0;border-top:1px solid var(--line)}
.time{font-size:13px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:2px}
.stop h3{margin:0 0 4px;font-size:16.5px;letter-spacing:-.02em;font-weight:650}
.stop p{margin:0;font-size:14px;color:var(--sub)}
.eat{margin-top:14px;grid-column:2}
.eat-h{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;font-weight:650;color:var(--ink);margin-bottom:8px}
.eat-h span{font-weight:500;color:var(--sub)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:active{background:#f6f6f4}
.meta{flex:1;min-width:0}
.name{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.desc{font-size:12.5px;color:var(--sub);margin-top:1px}
.walk{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.go{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.taxi{margin-top:10px;font-size:12px;color:var(--sub)}
.taxi b{color:var(--ink);font-weight:600}
@media(max-width:520px){.stop{grid-template-columns:1fr}.time{padding:0 0 4px}.eat{grid-column:1}.walk{font-size:11px;padding:3px 7px}}

.maplink{grid-column:2;display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:600;width:max-content}.maplink .go{width:22px;height:22px;font-size:11px}
@media(max-width:520px){.maplink{grid-column:1}}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">BUSAN · 1박 2일</div>
  <h1>윤&준우의 부산 여행</h1>
  <p class="lead">엄마 둘, 7세 둘. 덜 걷고 더 즐겁게.</p>
  <div class="facts">
    <div>금요일 도착<b>11:04 부산역</b></div>
    <div>스카이캡슐<b>금 15:45</b></div>
    <div>토요일 출발<b>18:00 부산역</b></div>
  </div>
</header>

<div class="note">토요일은 불꽃축제 인파가 있어요. 10시 숙소 출발 → 부산역 짐 보관 → 영도·남포동 순서로 움직이고, 16:20에 남포동을 떠나요.</div>

<div class="tabs"><div class="seg">
  <button class="tab on" data-tab="fri">금요일</button>
  <button class="tab" data-tab="sat">토요일</button>
</div></div>

<section id="fri" class="panel on"></section>
<section id="sat" class="panel"></section>

<footer>식당 영업시간·휴무·웨이팅은 바뀔 수 있어요. 가기 전 네이버지도에서 확인하세요.<br>도보 시간은 대략치예요. 지도 앱에서 현재 위치 기준으로 한 번 더 확인하세요.</footer>
</div>

const naver=n=>'https://map.naver.com/p/search/'+encodeURIComponent(n+' 부산');
function eatHTML(e){
  const note=e.note?`<div class="taxi">${e.note}</div>`:'';
  const rows=e.items.map(([n,d,w])=>`<a class="item" target="_blank" rel="noopener" href="${naver(n)}"><div class="meta"><div class="name">${n}</div><div class="desc">${d}</div></div><span class="walk">${w}</span><span class="go" aria-label="네이버지도">N</span></a>`).join('');
  const taxi=e.taxi?`<div class="taxi">${e.taxiNames.map(n=>`<a target="_blank" rel="noopener" href="${naver(n)}"><b>${n}</b></a>`).join(' · ')} <span>— 도보 아님, 택시 필요</span></div>`:'';
  return `<div class="eat"><div class="eat-h">${e.label}<span>${e.base}</span></div><div class="list">${rows}</div>${taxi}${note}</div>`;
}
for(const [id,d] of Object.entries(days)){
  document.getElementById(id).innerHTML=`<h2 class="day-title">${d.title}</h2><p class="route">${d.route}</p>`+d.stops.map(s=>`<article class="stop"><div class="time">${s.t}</div><div><h3>${s.h}</h3><p>${s.p}</p></div>${s.link?`<a class="maplink" target="_blank" rel="noopener" href="${naver(s.link[0]).replace('%20%EB%B6%80%EC%82%B0','')}"><span class="go">N</span>${s.link[1]}</a>`:''}${s.eat?eatHTML(s.eat):''}${s.eat2?eatHTML(s.eat2):''}</article>`).join('');
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');document.getElementById(b.dataset.tab).classList.add('on');
  scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
